main:
    params: [input]
    steps:
        - init:
            assign:
                - project_id: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
                - bucket: ${input.bucket}
                - file: ${input.file}
        - transcribe:
            call: googleapis.aiplatform.v1.projects.locations.customJobs.create
            args:
                parent: ${"projects/" + project_id + "/locations/us-central1"}
                region: us-central1
                customJob:
                    displayName: "WhisperTranscription"
                    jobSpec:
                        workerPoolSpecs:
                            - machineSpec:
                                machineType: n1-standard-4
                                acceleratorType: NVIDIA_TESLA_T4
                                acceleratorCount: 1
                              replicaCount: 1
                              containerSpec:
                                imageUri: ${"us-central1-docker.pkg.dev/" + project_id + "/sutta-pipeline/whisper:latest"}
                                args: ["--input", ${"gs://" + bucket + "/" + file}]
        - process_spark:
            call: googleapis.dataproc.v1.projects.regions.batches.create
            args:
                parent: ${"projects/" + project_id + "/regions/us-central1"}
                region: us-central1
                batchId: ${"sutta-split-" + string(int(now()))}
                batch:
                    pysparkBatch:
                        mainPythonFileUri: "gs://scripts/splitter.py"
                        args: ["--input", "gs://whisper-output/raw.json"]
        - audit_check:
            call: googleapis.pubsub.v1.projects.topics.publish
            args:
                topic: ${"projects/" + project_id + "/topics/human-audit"}
                body:
                    messages:
                        - data: ${base64.encode(json.encode(input))}
